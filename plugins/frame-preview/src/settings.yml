---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: node
refresh_interval_floor: ''
polling_url: https://cdn.jsdelivr.net/gh/michaelkurath/TRMNL-AlertSwiss@main/data/alerts.json
polling_headers: ''
polling_body: ''
id: 544740
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: preview_mode
  name: Preview data
  field_type: select
  options:
  - Demo
  - Live
  - Empty
  - Unavailable
  default: demo
  description: Demo shows sample alerts. Live reads the public mirror. Empty and Unavailable simulate those states.
- keyname: display_style
  name: Display style
  field_type: select
  options:
  - Auto: auto
  - Frame map: map
  - Classic list: classic
  default: auto
  description: Auto uses the colour map on Frame and the classic monochrome list on X and OG. Use Frame map to force it in the editor.
- keyname: cantons
  name: Cantons (comma-separated)
  field_type: string
  placeholder: ZH,SG,SH
  default: CH
  optional: true
  description: Use CH for all cantons. Nationwide notices are always included in the filter.
- keyname: limit
  name: Max notices on the map
  field_type: number
  default: 5
  optional: true
  description: Show up to five matching notices in the list. Canton colours reflect all matching regional notices.
name: Alert.Swiss Frame Preview
description: Swiss alert map test recipe
refresh_interval: 60
